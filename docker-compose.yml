services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gym_crm
      POSTGRES_USER: gym_crm_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_crm_user -d gym_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: gym-crm:1.0
    container_name: gym-crm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gym_crm
      DB_USERNAME: gym_crm_user
      DB_PASSWORD: gym_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
