services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gym_crm
      POSTGRES_USER: gym_crm_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_crm_user -d gym_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery-service:
    build: ./discovery-service
    image: discovery-service:1.0
    container_name: gym-discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  trainer-workload-service:
    build: ./trainer-workload-service
    image: trainer-workload-service:1.0
    container_name: gym-trainer-workload
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: gym-crm:1.0
    container_name: gym-crm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gym_crm
      DB_USERNAME: gym_crm_user
      DB_PASSWORD: gym_password
      EUREKA_URI: http://discovery-service:8761/eureka/
      WORKLOAD_SERVICE_URL: http://trainer-workload-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: