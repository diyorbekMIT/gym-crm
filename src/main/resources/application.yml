spring:
  application:
    name: gym-crm
  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  health:
    defaults:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

workload:
  service:
    url: http://trainer-workload-service

resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2