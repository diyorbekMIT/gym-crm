spring:
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/gym_crm_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.gym.crm: INFO
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: never